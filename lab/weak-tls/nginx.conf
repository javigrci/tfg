# TLS deliberadamente débil — SOLO para el laboratorio de AuditFlow (spec 011a).
server {
    listen 443 ssl;
    server_name weak-tls.lab;

    ssl_certificate     /etc/nginx/certs/self.crt;
    ssl_certificate_key /etc/nginx/certs/self.key;

    # Protocolos obsoletos habilitados a propósito (testssl los marca LOW/MEDIUM).
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    # Cifrados débiles a propósito (RC4, 3DES, export).
    ssl_ciphers 'RC4:3DES:DES:!aNULL:!eNULL:HIGH:MEDIUM:LOW:@SECLEVEL=0';
    ssl_prefer_server_ciphers off;

    # Sin HSTS, sin OCSP stapling — postura deliberadamente pobre.

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}

# Redirección HTTP→HTTPS NO forzada (a propósito).
server {
    listen 80;
    server_name weak-tls.lab;
    location / { return 200 "AuditFlow lab weak-tls (usa https://)\n"; }
}
